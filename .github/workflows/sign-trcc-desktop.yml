name: Sign TRCC Desktop

on:
  workflow_dispatch:
    inputs:
      desktop_sha:
        description: Full current Lore-Hex/confidential-cowork-desktop main SHA
        required: true
        type: string
      runtime_sha:
        description: Full current Lore-Hex/trpi main SHA
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: sign-trcc-desktop
  cancel-in-progress: false

jobs:
  sign:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          path: signing
      - uses: actions/checkout@v7
        with:
          repository: Lore-Hex/confidential-cowork-desktop
          ref: ${{ inputs.desktop_sha }}
          persist-credentials: false
          path: desktop
      - uses: actions/checkout@v7
        with:
          repository: Lore-Hex/trpi
          ref: ${{ inputs.runtime_sha }}
          persist-credentials: false
          path: trpi
      - name: Verify both immutable sources are current main
        env:
          DESKTOP_SHA: ${{ inputs.desktop_sha }}
          RUNTIME_SHA: ${{ inputs.runtime_sha }}
        run: |
          set -euo pipefail
          [[ "$DESKTOP_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RUNTIME_SHA" =~ ^[0-9a-f]{40}$ ]]
          for repo in desktop trpi; do
            expected="$DESKTOP_SHA"
            [[ "$repo" != trpi ]] || expected="$RUNTIME_SHA"
            test "$(git -C "$repo" rev-parse HEAD)" = "$expected"
            git -C "$repo" fetch --no-tags --depth=1 origin main
            test "$(git -C "$repo" rev-parse FETCH_HEAD)" = "$expected"
          done
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: brew install fd ripgrep
      - name: Verify runtime
        working-directory: trpi
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm run hydrate:model-data
          npm run build:offline
          npm run check
          ./test.sh
      - name: Build both runtime architectures
        working-directory: trpi
        run: |
          set -euo pipefail
          scripts/build-binaries.sh --skip-install --skip-build --offline-model-data --platform darwin-arm64 --out "$RUNNER_TEMP/runtime-arm"
          scripts/build-binaries.sh --skip-install --skip-build --offline-model-data --platform darwin-x64 --out "$RUNNER_TEMP/runtime-x64"
          target="$GITHUB_WORKSPACE/desktop/resources/runtime"
          test ! -e "$target"
          cp -R "$RUNNER_TEMP/runtime-arm/darwin-arm64" "$target"
          lipo -create "$RUNNER_TEMP/runtime-arm/darwin-arm64/tr-cowork" "$RUNNER_TEMP/runtime-x64/darwin-x64/tr-cowork" -output "$target/tr-cowork"
          cp -R "$RUNNER_TEMP/runtime-x64/darwin-x64/native/darwin/prebuilds/darwin-x64" "$target/native/darwin/prebuilds/"
          lipo "$target/tr-cowork" -verify_arch arm64 x86_64
          "$target/tr-cowork" --version
      - name: Verify desktop
        working-directory: desktop
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          node node_modules/electron/install.js
          npx --no-install electron-builder install-app-deps
          npm run typecheck
          npm run lint
          find src resources -name '*.test.ts' -not -path 'resources/runtime/*' -print0 | xargs -0 node --import tsx --test --test-concurrency=1
          npm run build
          node scripts/cowork-desktop-smoke.mjs
      - name: Import signing credentials
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          SIGN_IDENTITY: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_IDENTITY }}
          NOTARY_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_NOTARY_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$CERTIFICATE_BASE64"
          test -n "$CERTIFICATE_PASSWORD"
          test -n "$SIGN_IDENTITY"
          test -n "$NOTARY_PRIVATE_KEY_BASE64"
          keychain="$RUNNER_TEMP/trcc-signing.keychain-db"
          password="$(openssl rand -hex 24)"
          certificate="$RUNNER_TEMP/developer-id.p12"
          printf '%s' "$CERTIFICATE_BASE64" | /usr/bin/base64 -D > "$certificate"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$certificate" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security list-keychains -d user -s "$keychain" login.keychain-db
          security default-keychain -d user -s "$keychain"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain"
          security find-identity -v -p codesigning "$keychain" | grep -F "$SIGN_IDENTITY"
          printf '%s' "$NOTARY_PRIVATE_KEY_BASE64" | /usr/bin/base64 -D > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"
      - name: Sign and notarize graphical app and DMG
        env:
          SIGN_IDENTITY: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_IDENTITY }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          DESKTOP_SHA: ${{ inputs.desktop_sha }}
          RUNTIME_SHA: ${{ inputs.runtime_sha }}
        run: bash signing/scripts/sign-trcc-desktop.sh
      - uses: actions/upload-artifact@v7
        with:
          name: trcc-desktop-signed-${{ inputs.desktop_sha }}
          path: |
            desktop/release/TR-Confidential-Cowork-Desktop-universal.dmg
            desktop/release/TR-Confidential-Cowork-Desktop-universal.dmg.sha256
            desktop/release/source-provenance.json
          if-no-files-found: error
          retention-days: 3
      - name: Remove signing material
        if: always()
        run: |
          security default-keychain -d user -s login.keychain-db || true
          security delete-keychain "$RUNNER_TEMP/trcc-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP/AuthKey.p8"
