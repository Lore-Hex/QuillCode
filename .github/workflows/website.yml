name: Website

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/website.yml
      - docs/images/quill-cowork-desktop.png
      - scripts/build-website.py
      - scripts/verify-website.py
      - website/**

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check website JavaScript
        run: node --check website/static/site.js
      - name: Test website JavaScript
        run: node Tests/ScriptTests/test_website_js.mjs
      - name: Test website release contract
        run: python3 Tests/ScriptTests/test_website.py
      - name: Build static website
        run: python3 scripts/build-website.py --output _site
      - name: Verify static website
        run: python3 scripts/verify-website.py --site _site
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
