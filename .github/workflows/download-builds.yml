name: Download Builds

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  schedule:
    - cron: "17 10 * * *"

permissions: {}

concurrency:
  group: download-builds-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-policy:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      build-required: ${{ steps.plan.outputs.build-required }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate download build ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/validate-download-build-ref.sh
      - name: Wait for successful exact-main CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/wait-for-successful-ci.sh
      - name: Plan download build
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/plan-download-build.sh

  capture-updater-source:
    needs: release-policy
    if: needs.release-policy.outputs.build-required == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Capture previous public updater sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" == v* ]]; then
            RELEASE_CHANNEL="stable"
          else
            RELEASE_CHANNEL="tester"
          fi
          for architecture in arm64 x86_64; do
            scripts/capture-public-updater-source.py \
              --repo "$GITHUB_REPOSITORY" \
              --channel "$RELEASE_CHANNEL" \
              --arch "$architecture" \
              --output-dir "$RUNNER_TEMP/prior-updater/$architecture" \
              --allow-missing
          done
      - name: Upload previous public updater sources
        uses: actions/upload-artifact@v7
        with:
          name: quillcode-prior-updater-sources
          path: ${{ runner.temp }}/prior-updater
          if-no-files-found: error
          retention-days: 14

  macos:
    needs: release-policy
    if: needs.release-policy.outputs.build-required == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify native build architecture
        run: |
          if [[ "$(uname -m)" != "${{ matrix.arch }}" ]]; then
            echo "Runner architecture $(uname -m) does not match ${{ matrix.arch }}." >&2
            exit 1
          fi
      - name: Set build metadata
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" == v* ]]; then
            echo "QUILLCODE_BUILD_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
            echo "QUILLCODE_UPDATE_CHANNEL=stable" >> "$GITHUB_ENV"
          else
            echo "QUILLCODE_BUILD_VERSION=0.1.0" >> "$GITHUB_ENV"
            echo "QUILLCODE_UPDATE_CHANNEL=tester" >> "$GITHUB_ENV"
          fi
          echo "QUILLCODE_BUILD_NUMBER=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
      - name: Configure Apple distribution signing
        env:
          APPLE_DEVELOPER_ID_CERTIFICATE_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_BASE64 }}
          APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          APPLE_DEVELOPER_ID_APPLICATION_IDENTITY: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_NOTARY_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_NOTARY_PRIVATE_KEY_BASE64 }}
        run: scripts/configure-macos-distribution-signing.sh
      - name: Package macOS app and CLI
        env:
          QUILLCODE_DOWNLOAD_DIST_DIR: ${{ runner.temp }}/quillcode-macos-downloads-${{ matrix.arch }}
        run: scripts/package-macos-downloads.sh
      - name: Remove temporary Apple signing material
        if: always()
        run: |
          if [[ -n "${QUILLCODE_MACOS_SIGNING_KEYCHAIN:-}" && -f "$QUILLCODE_MACOS_SIGNING_KEYCHAIN" ]]; then
            security delete-keychain "$QUILLCODE_MACOS_SIGNING_KEYCHAIN" || true
          fi
          if [[ -n "${QUILLCODE_MACOS_NOTARY_KEY_PATH:-}" && -f "$QUILLCODE_MACOS_NOTARY_KEY_PATH" ]]; then
            rm -f "$QUILLCODE_MACOS_NOTARY_KEY_PATH"
          fi
          if [[ -n "${QUILLCODE_MACOS_SIGNING_CERTIFICATE_PATH:-}" && -f "$QUILLCODE_MACOS_SIGNING_CERTIFICATE_PATH" ]]; then
            rm -f "$QUILLCODE_MACOS_SIGNING_CERTIFICATE_PATH"
          fi
      - name: Upload macOS downloads
        uses: actions/upload-artifact@v7
        with:
          name: quillcode-macos-downloads-${{ matrix.arch }}
          path: ${{ runner.temp }}/quillcode-macos-downloads-${{ matrix.arch }}/assets/*
          if-no-files-found: error
          retention-days: 14

  macos-universal:
    needs: [release-policy, macos]
    if: needs.release-policy.outputs.build-required == 'true'
    runs-on: macos-15
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: quillcode-macos-downloads-*
          path: ${{ runner.temp }}/thin-macos-downloads
      - name: Set release channel
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" == v* ]]; then
            echo "QUILLCODE_UPDATE_CHANNEL=stable" >> "$GITHUB_ENV"
          else
            echo "QUILLCODE_UPDATE_CHANNEL=tester" >> "$GITHUB_ENV"
          fi
      - name: Configure Apple distribution signing
        env:
          APPLE_DEVELOPER_ID_CERTIFICATE_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_BASE64 }}
          APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          APPLE_DEVELOPER_ID_APPLICATION_IDENTITY: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_NOTARY_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_NOTARY_PRIVATE_KEY_BASE64 }}
        run: scripts/configure-macos-distribution-signing.sh
      - name: Package universal macOS installer
        run: |
          mkdir -p "$RUNNER_TEMP/quillcode-macos-downloads-universal"
          scripts/package-macos-universal-installer.sh \
            --arm64-app-zip "$RUNNER_TEMP/thin-macos-downloads/quillcode-macos-downloads-arm64/Quill-Cowork-macOS-arm64.zip" \
            --x86-64-app-zip "$RUNNER_TEMP/thin-macos-downloads/quillcode-macos-downloads-x86_64/Quill-Cowork-macOS-x86_64.zip" \
            --output "$RUNNER_TEMP/quillcode-macos-downloads-universal/Quill-Cowork-macOS-universal.dmg"
      - name: Remove temporary Apple signing material
        if: always()
        run: |
          if [[ -n "${QUILLCODE_MACOS_SIGNING_KEYCHAIN:-}" && -f "$QUILLCODE_MACOS_SIGNING_KEYCHAIN" ]]; then
            security delete-keychain "$QUILLCODE_MACOS_SIGNING_KEYCHAIN" || true
          fi
          if [[ -n "${QUILLCODE_MACOS_NOTARY_KEY_PATH:-}" && -f "$QUILLCODE_MACOS_NOTARY_KEY_PATH" ]]; then
            rm -f "$QUILLCODE_MACOS_NOTARY_KEY_PATH"
          fi
          if [[ -n "${QUILLCODE_MACOS_SIGNING_CERTIFICATE_PATH:-}" && -f "$QUILLCODE_MACOS_SIGNING_CERTIFICATE_PATH" ]]; then
            rm -f "$QUILLCODE_MACOS_SIGNING_CERTIFICATE_PATH"
          fi
      - name: Upload universal macOS installer
        uses: actions/upload-artifact@v7
        with:
          name: quillcode-macos-downloads-universal
          path: ${{ runner.temp }}/quillcode-macos-downloads-universal/Quill-Cowork-macOS-universal.dmg
          if-no-files-found: error
          retention-days: 14

  linux:
    needs: release-policy
    if: needs.release-policy.outputs.build-required == 'true'
    runs-on: ubuntu-latest
    container: swift:6.2-noble
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set build metadata
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" == v* ]]; then
            echo "QUILLCODE_BUILD_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
            echo "QUILLCODE_UPDATE_CHANNEL=stable" >> "$GITHUB_ENV"
          else
            echo "QUILLCODE_BUILD_VERSION=0.1.0" >> "$GITHUB_ENV"
            echo "QUILLCODE_UPDATE_CHANNEL=tester" >> "$GITHUB_ENV"
          fi
          echo "QUILLCODE_BUILD_NUMBER=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
      - name: Package Linux CLI
        env:
          QUILLCODE_DOWNLOAD_DIST_DIR: /tmp/quillcode-linux-downloads
        run: scripts/package-linux-downloads.sh
      - name: Upload Linux downloads
        uses: actions/upload-artifact@v7
        with:
          name: quillcode-linux-downloads
          path: /tmp/quillcode-linux-downloads/assets/*
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [macos, macos-universal, linux, capture-updater-source]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    outputs:
      published: ${{ steps.publication.outputs.publish-required }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          pattern: quillcode-*-downloads*
          path: ${{ runner.temp }}/downloaded-artifacts
      - name: Prepare release assets
        run: |
          mkdir -p "$RUNNER_TEMP/release-assets"
          find "$RUNNER_TEMP/downloaded-artifacts" -maxdepth 3 -type f -print -exec cp {} "$RUNNER_TEMP/release-assets/" \;
          cp "$RUNNER_TEMP/downloaded-artifacts/quillcode-macos-downloads-arm64/BUILD_INFO-macOS-arm64.txt" \
            "$RUNNER_TEMP/release-assets/BUILD_INFO.txt"
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" == v* ]]; then
            RELEASE_TAG="${GITHUB_REF_NAME}"
            RELEASE_CHANNEL="stable"
          else
            RELEASE_TAG="tester-latest"
            RELEASE_CHANNEL="tester"
          fi
          MANIFEST_NAME="latest-${RELEASE_CHANNEL}-build.json"
          (
            cd "$RUNNER_TEMP/release-assets"
            find . -maxdepth 1 -type f ! -name SHASUMS256.txt -printf '%P\0' | sort -z | xargs -0 sha256sum > SHASUMS256.txt
          )
          scripts/build-download-manifest.py \
            --assets-dir "$RUNNER_TEMP/release-assets" \
            --repo "$GITHUB_REPOSITORY" \
            --tag "$RELEASE_TAG" \
            --channel "$RELEASE_CHANNEL" \
            --commit "$GITHUB_SHA" \
            --workflow-run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --output "$RUNNER_TEMP/release-assets/$MANIFEST_NAME"
          find "$RUNNER_TEMP/release-assets" -maxdepth 1 -type f -print | sort
      - name: Recheck publication freshness
        id: publication
        run: scripts/plan-download-publication.sh
      - name: Publish tester or tagged release
        if: steps.publication.outputs.publish-required == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" == v* ]]; then
            RELEASE_TAG="${GITHUB_REF_NAME}"
            RELEASE_TITLE="Quill Cowork ${GITHUB_REF_NAME}"
            RELEASE_CHANNEL="stable"
          else
            RELEASE_TAG="tester-latest"
            RELEASE_TITLE="Quill Cowork Tester Build"
            RELEASE_CHANNEL="tester"
          fi
          scripts/build-release-notes.py \
            --build-info "$RUNNER_TEMP/release-assets/BUILD_INFO.txt" \
            --repo "$GITHUB_REPOSITORY" \
            --tag "$RELEASE_TAG" \
            --channel "$RELEASE_CHANNEL" \
            --commit "$GITHUB_SHA" \
            --workflow-run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --output "$RUNNER_TEMP/release-notes.md"

          if [[ "$RELEASE_CHANNEL" == "stable" ]]; then
            if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
              echo "Stable release $RELEASE_TAG already exists and is immutable." >&2
              exit 2
            fi
            gh release create "$RELEASE_TAG" \
              --verify-tag \
              --draft \
              --title "$RELEASE_TITLE" \
              --notes-file "$RUNNER_TEMP/release-notes.md" \
              --target "$GITHUB_SHA"
            gh release upload "$RELEASE_TAG" "$RUNNER_TEMP"/release-assets/*
            gh release edit "$RELEASE_TAG" \
              --draft=false \
              --prerelease \
              --latest=false
          else
            scripts/publish-tester-release.py \
              --assets-dir "$RUNNER_TEMP/release-assets" \
              --notes-file "$RUNNER_TEMP/release-notes.md" \
              --repo "$GITHUB_REPOSITORY" \
              --commit "$GITHUB_SHA" \
              --run-id "$GITHUB_RUN_ID"
          fi

  verify-published:
    needs: publish
    if: needs.publish.outputs.published == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify public release downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" == v* ]]; then
            RELEASE_TAG="${GITHUB_REF_NAME}"
            RELEASE_CHANNEL="stable"
          else
            RELEASE_TAG="tester-latest"
            RELEASE_CHANNEL="tester"
          fi
          VERIFY_ARGUMENTS=(
            --repo "$GITHUB_REPOSITORY"
            --tag "$RELEASE_TAG"
            --channel "$RELEASE_CHANNEL"
            --commit "$GITHUB_SHA"
            --workflow-run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          )
          if [[ "$RELEASE_CHANNEL" == "stable" ]]; then
            VERIFY_ARGUMENTS+=(--stable-candidate)
          fi
          scripts/verify-published-release.py "${VERIFY_ARGUMENTS[@]}"

  verify-updater:
    needs: [publish, verify-published, capture-updater-source]
    if: >-
      ${{
        always() &&
        needs.publish.result == 'success' &&
        needs.verify-published.result == 'success' &&
        needs.capture-updater-source.result == 'success'
      }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Download previous public updater source
        uses: actions/download-artifact@v8
        with:
          name: quillcode-prior-updater-sources
          path: ${{ runner.temp }}/prior-updater
      - name: Verify native updater architecture
        run: |
          if [[ "$(uname -m)" != "${{ matrix.arch }}" ]]; then
            echo "Runner architecture $(uname -m) does not match ${{ matrix.arch }}." >&2
            exit 1
          fi
      - name: Download public updater inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" == v* ]]; then
            RELEASE_TAG="${GITHUB_REF_NAME}"
            RELEASE_CHANNEL="stable"
          else
            RELEASE_TAG="tester-latest"
            RELEASE_CHANNEL="tester"
          fi
          mkdir -p "$RUNNER_TEMP/public-updater"
          gh release download "$RELEASE_TAG" \
            --pattern 'Quill-Cowork-macOS-${{ matrix.arch }}.zip' \
            --dir "$RUNNER_TEMP/public-updater"
          gh release download "$RELEASE_TAG" \
            --pattern 'Quill-Cowork-macOS-universal.dmg' \
            --dir "$RUNNER_TEMP/public-updater"
          gh release download "$RELEASE_TAG" \
            --pattern "latest-${RELEASE_CHANNEL}-build.json" \
            --dir "$RUNNER_TEMP/public-updater"
      - name: Verify universal installer launches natively
        run: |
          scripts/packaged-macos-relocation-smoke.sh \
            --dmg "$RUNNER_TEMP/public-updater/Quill-Cowork-macOS-universal.dmg" \
            --expected-architecture '${{ matrix.arch }}'
      - name: Verify public app updates and relaunches itself
        env:
          QUILLCODE_UPDATER_SMOKE_ARTIFACT_DIR: ${{ runner.temp }}/updater-smoke-artifacts
        run: |
          TARGET_APP_ZIPS=("$RUNNER_TEMP"/public-updater/Quill-Cowork-macOS-${{ matrix.arch }}.zip)
          TARGET_MANIFESTS=("$RUNNER_TEMP"/public-updater/latest-*-build.json)
          CAPTURE_DIR="$RUNNER_TEMP/prior-updater/${{ matrix.arch }}"
          if [[ ${#TARGET_APP_ZIPS[@]} -ne 1 || ${#TARGET_MANIFESTS[@]} -ne 1 ||
                ! -f "$CAPTURE_DIR/capture.json" ]]; then
            echo "Expected one target app, target manifest, and prior-source capture." >&2
            exit 1
          fi
          UPDATER_ARGUMENTS=(--manifest "${TARGET_MANIFESTS[0]}")
          if [[ "$(plutil -extract sourceAvailable raw "$CAPTURE_DIR/capture.json")" == "true" ]]; then
            UPDATER_ARGUMENTS+=(
              --app-zip "$CAPTURE_DIR/source-app.zip"
              --source-manifest "$CAPTURE_DIR/source-manifest.json"
            )
          else
            UPDATER_ARGUMENTS+=(--app-zip "${TARGET_APP_ZIPS[0]}")
          fi
          scripts/packaged-macos-updater-smoke.sh "${UPDATER_ARGUMENTS[@]}"
      - name: Upload updater smoke evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quillcode-public-updater-smoke-${{ matrix.arch }}
          path: ${{ runner.temp }}/updater-smoke-artifacts
          if-no-files-found: error
          retention-days: 14

  quarantine-stable-candidate:
    needs: [publish, verify-published, verify-updater]
    if: >-
      ${{
        always() &&
        github.ref_type == 'tag' &&
        startsWith(github.ref_name, 'v') &&
        needs.publish.result == 'success' &&
        (
          needs.verify-published.result != 'success' ||
          needs.verify-updater.result != 'success'
        )
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Return failed stable candidate to draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft --latest=false --repo "$GITHUB_REPOSITORY"

  promote-stable:
    needs: [publish, verify-published, verify-updater]
    if: >-
      ${{
        github.ref_type == 'tag' &&
        startsWith(github.ref_name, 'v') &&
        needs.publish.result == 'success' &&
        needs.verify-published.result == 'success' &&
        needs.verify-updater.result == 'success'
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Promote verified stable candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release edit "$GITHUB_REF_NAME"
          --draft=false
          --prerelease=false
          --latest
          --repo "$GITHUB_REPOSITORY"

  verify-stable-promotion:
    needs: [promote-stable, verify-updater]
    if: >-
      ${{
        github.ref_type == 'tag' &&
        startsWith(github.ref_name, 'v') &&
        needs.promote-stable.result == 'success' &&
        needs.verify-updater.result == 'success'
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify promoted stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/verify-published-release.py \
            --repo "$GITHUB_REPOSITORY" \
            --tag "$GITHUB_REF_NAME" \
            --channel stable \
            --commit "$GITHUB_SHA" \
            --workflow-run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

  quarantine-promoted-stable:
    needs: [publish, promote-stable, verify-stable-promotion]
    if: >-
      ${{
        always() &&
        github.ref_type == 'tag' &&
        startsWith(github.ref_name, 'v') &&
        needs.publish.result == 'success' &&
        needs.promote-stable.result == 'success' &&
        needs.verify-stable-promotion.result != 'success'
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Return failed promoted stable release to draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft --latest=false --repo "$GITHUB_REPOSITORY"
